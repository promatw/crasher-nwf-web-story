<header class="reader-header"><div class="eyebrow"><a href="/crasher-nwf-web-story/manga/">Crasher 漫畫閱讀</a> · Local reading test · noindex</div><h1>EP32 · Crasher: New World Fighter</h1></header><nav class="reader-nav" aria-label="Episode navigation" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:16px 12px"><a href="/crasher-nwf-web-story/manga/">漫畫首頁</a><a href="/crasher-nwf-web-story/manga/ep29/">上一個可讀話數：EP29</a></nav>

<script>
(()=>{"use strict";const base="/crasher-nwf-web-story/",root=document.getElementById("reader-pages");const config=document.createElement("script");config.src=base+"js/tools-new-manga-editor-config.js";config.onload=load;config.onerror=()=>root.textContent="Reader config could not be loaded.";document.head.append(config);function jsonUrl(page){return base+"data/manga_new/ep32/zh-tw/v01/c_nwf_ch02_ep32_"+page+"_text_zh-tw_v01.json"}function draw(stage,layer,data){window.CrasherTextLayerRenderer.render(stage,layer,data,"preview-box",false)}async function makePage(page,cfg,index){const article=document.createElement("article"),label=document.createElement("div"),title=document.createElement("strong"),count=document.createElement("span"),stage=document.createElement("div"),img=document.createElement("img"),layer=document.createElement("div");article.className="reader-page";label.className="page-label";title.textContent=cfg.label||page;count.textContent="EP32 · "+(index+1);label.append(title,count);stage.className="preview-stage";stage.style.aspectRatio=cfg.width+" / "+cfg.height;img.src=base+window.CRASHER_MANGA_NEW_CONFIG.imageBase+cfg.artAsset;img.alt="EP32 "+(cfg.label||page);layer.className="preview-layer";stage.append(img,layer);article.append(label,stage);try{const r=await fetch(jsonUrl(page),{cache:"no-store"});if(r.ok){const data=await r.json();if(data.episode==="ep32"&&data.page===page&&data.locale==="zh-tw"){const render=()=>draw(stage,layer,data);if(img.complete)render();else img.addEventListener("load",render,{once:true});new ResizeObserver(render).observe(stage)}}}catch(_){ }return article}async function load(){const cfg=window.CRASHER_MANGA_NEW_CONFIG?.episodes?.ep32;if(!cfg){root.textContent="EP32 configuration unavailable.";return}root.replaceChildren();const entries=Object.entries(cfg.pages);for(let i=0;i<entries.length;i++){const [page,pageCfg]=entries[i];root.append(await makePage(page,pageCfg,i))}}})();
</script>
