<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>EP29 | Crasher Reader</title><link rel="stylesheet" href="/crasher-nwf-web-story/css/manga-episode-preview.css"><style>:root{color-scheme:dark;--bg:#111315;--line:#30363d;--muted:#9aa4ae}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f5f7;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.reader-header{max-width:980px;margin:0 auto;padding:28px 18px 20px;border-bottom:1px solid var(--line)}.eyebrow{color:#e6b94f;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}h1{margin:8px 0 4px;font-size:clamp(1.45rem,4vw,2.2rem)}.reader-header p{margin:8px 0;color:var(--muted)}.reader-pages{width:min(100%,980px);margin:0 auto;padding:24px 12px 64px}.reader-page{margin:0 auto 28px}.page-label{display:flex;justify-content:space-between;padding:0 4px 8px;color:var(--muted);font-size:.85rem}.page-label strong{color:#f3f5f7}.reader-stage{position:relative;width:100%;overflow:hidden;background:#08090a;box-shadow:0 12px 30px rgba(0,0,0,.28)}.reader-stage>img{display:block;width:100%;height:100%;object-fit:fill}.reader-layer{position:absolute;inset:0;pointer-events:none}.reader-box{position:absolute;display:flex;align-items:center;justify-content:center;padding:.2em .35em;overflow:hidden;color:#111;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;line-height:1.25}.reader-box[data-shape=rectangle]{background:#fff;border:2px solid #111;border-radius:4px}.reader-box[data-shape=ellipse]{background:#fff;border:2px solid #111;border-radius:50%}.reader-box span{display:block;max-width:100%;max-height:100%}.reader-box.is-overflowing{outline:2px solid #e45757;outline-offset:-2px}.reader-debug .reader-box{outline:1px dashed rgba(255,188,64,.95);outline-offset:-1px}.reader-debug .reader-box::after{content:attr(data-box-id);position:absolute;left:0;top:0;padding:2px 4px;background:rgba(0,0,0,.78);color:#ffd36a;font:11px/1.1 ui-monospace,monospace}.reader-debug .reader-stage::after{content:attr(data-debug-meta);position:absolute;left:6px;bottom:6px;padding:4px 6px;background:rgba(0,0,0,.78);color:#d8f3ff;font:11px/1.2 ui-monospace,monospace}@media(max-width:560px){.reader-header{padding:22px 15px 16px}.reader-pages{padding:16px 6px 42px}.reader-box{border-width:1px}}</style></head>
<body><header class="reader-header"><div class="eyebrow"><a href="/crasher-nwf-web-story/manga/" style="color:inherit">Crasher 漫畫閱讀</a> · Local reading test · noindex</div><h1>EP29 · Crasher: New World Fighter</h1><p>Continuous reader. Add <code>?debug=1</code> for box diagnostics.</p></header><main id="reader-pages" class="reader-pages"><div>Loading EP29...</div></main>
<script src="/crasher-nwf-web-story/js/manga-text-layer-renderer.js"></script><script>
(()=>{"use strict";const base="/crasher-nwf-web-story/",root=document.getElementById("reader-pages"),debug=new URLSearchParams(location.search).get("debug")==="1";if(debug)document.body.classList.add("reader-debug");const config=document.createElement("script");config.src=base+"js/tools-new-manga-editor-config.js";config.onload=load;config.onerror=()=>root.textContent="Reader config could not be loaded.";document.head.append(config);
function jsonUrl(page){return base+"data/manga_new/ep29/zh-tw/v01/c_nwf_ch02_ep29_"+page+"_text_zh-tw_v01.json"}
function draw(stage,layer,data){const nodes=window.CrasherTextLayerRenderer.render(stage,layer,data,"preview-box",false);if(debug)nodes.forEach((n,i)=>{const b=data.boxes[i],w=Number(data.source?.width||1024),h=Number(data.source?.height||1536);n.title=b.id+" | source px x="+(b.box.x*w/100).toFixed(1)+", y="+(b.box.y*h/100).toFixed(1)+", w="+(b.box.width*w/100).toFixed(1)+", h="+(b.box.height*h/100).toFixed(1)})}
async function makePage(page,cfg,index){const article=document.createElement("article"),label=document.createElement("div"),title=document.createElement("strong"),stage=document.createElement("div"),img=document.createElement("img"),layer=document.createElement("div");article.className="reader-page";label.className="page-label";title.textContent=cfg.label||page;label.append(title,document.createTextNode("EP29 · "+(index+1)));stage.className="preview-stage";stage.style.aspectRatio=cfg.width+" / "+cfg.height;if(debug)stage.dataset.debugMeta=cfg.artAsset+" · "+cfg.width+"x"+cfg.height;img.src=base+window.CRASHER_MANGA_NEW_CONFIG.imageBase+cfg.artAsset;img.alt="EP29 "+(cfg.label||page);layer.className="preview-layer";stage.append(img,layer);article.append(label,stage);try{const r=await fetch(jsonUrl(page),{cache:"no-store"});if(r.ok){const data=await r.json();if(data.episode==="ep29"&&data.page===page&&data.locale==="zh-tw"){const render=()=>draw(stage,layer,data);if(img.complete)render();else img.addEventListener("load",render,{once:true});new ResizeObserver(render).observe(stage)}}}catch(_){ }return article}
async function load(){const cfg=window.CRASHER_MANGA_NEW_CONFIG?.episodes?.ep29;if(!cfg){root.textContent="EP29 configuration unavailable.";return}root.replaceChildren();const entries=Object.entries(cfg.pages);for(let i=0;i<entries.length;i++){const [page,pageCfg]=entries[i];root.append(await makePage(page,pageCfg,i))}}
})();</script></body></html>
