<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tools New Manga Text Editor</title>
  <link rel="stylesheet" href="/crasher-nwf-web-story/css/tools_new/manga-text-editor.css">
  <link rel="stylesheet" href="/crasher-nwf-web-story/css/tools_new/manga-text-editor-v02.css">
  <link rel="stylesheet" href="/crasher-nwf-web-story/css/tools_new/manga-text-editor-v03.css">
  <link rel="stylesheet" href="/crasher-nwf-web-story/css/tools_new/manga-text-editor-v04.css">
  <link rel="stylesheet" href="/crasher-nwf-web-story/css/tools_new/manga-text-editor-v06.css">
  <link rel="stylesheet" href="/crasher-nwf-web-story/css/tools_new/manga-text-editor-v09.css">
</head>
<body>
  <main class="editor-app" data-editor-app>
    <header class="app-header">
      <div>
        <div class="header-status-row">
          <p class="eyebrow">Local production tool · tools_new V0.1</p>
          <span class="save-state" data-save-state>已載入</span>
        </div>
        <h1>Crasher Manga Text Layer Editor</h1>
        <p class="subtitle">tools_new · episode-driven · zh-tw</p>
        <div class="episode-switch" role="group" aria-label="選擇話數" data-episode-switch></div>
        <div class="page-switch" role="group" aria-label="選擇頁面" data-page-switch></div>
      </div>
      <div class="mode-switch" role="group" aria-label="模式切換">
        <button type="button" class="is-active" data-mode="edit">編輯</button>
        <button type="button" data-mode="preview">預覽</button>
      </div>
    </header>

    <section class="workspace">
      <aside class="control-panel" aria-label="漫畫文字圖層控制面板">
        <section class="panel-section">
          <h2>專案資料</h2>
          <div class="field-grid">
            <label>Project<input data-meta="project" value="crasher-nwf" readonly></label>
            <label>Chapter<input data-meta="chapter" value="ch02" readonly></label>
            <label>Episode<input data-meta="episode" value="ep21" readonly></label>
            <label>Page<input data-meta="page" value="001_p01" readonly></label>
            <label>Version<input data-meta="version" value="v01" readonly></label>
            <label>Locale<input data-meta="locale" value="zh-tw" readonly></label>
          </div>
          <label class="full-field">匯出檔名
            <output data-filename>c_nwf_ch02_ep21_001_p01_text_zh-tw_v01.json</output>
          </label>
          <dl class="metadata-summary" data-metadata-summary></dl>
        </section>

        <section class="panel-section">
          <div class="section-heading">
            <h2>文字框清單</h2>
            <button type="button" class="primary-action" data-add-box>增加文字框</button>
          </div>
          <div class="box-list" data-box-list aria-label="文字框清單"></div>
          <div class="empty-state" data-empty-state hidden>目前沒有文字框。</div>
        </section>

        <section class="panel-section">
          <h2>建議台詞</h2>
          <p class="seed-help">tools_new 不自動匯入 seed；EP21 placeholder disabled，EP22 / EP23 draft candidate 需 HM 手動套用。</p>
          <div class="seed-list" data-seed-list></div>
          <p class="status-line" data-seed-status></p>
        </section>

        <section class="panel-section box-controls" data-box-controls>
          <div class="selected-heading">
            <div><span class="field-caption">目前選取</span><strong data-selected-id></strong></div>
            <button type="button" class="danger-icon" data-remove-box title="移除目前文字框" aria-label="移除目前文字框">×</button>
          </div>
          <label class="full-field">文字<textarea rows="4" data-box-text></textarea></label>
          <div class="field-grid">
            <label>Type<select data-box-type><option value="caption">caption</option><option value="dialogue">dialogue</option><option value="reaction">reaction</option><option value="unknown">unknown</option></select></label>
            <label>Speaker<input data-box-speaker placeholder="例如 narration"></label>
            <label>Reading order<input type="number" min="1" step="1" data-reading-order></label>
            <label>Font size<input type="number" min="10" max="72" step="1" data-font-size></label>
            <label>Shape<select data-box-shape><option value="text-only">text-only</option><option value="rectangle">rectangle</option><option value="ellipse">ellipse</option></select></label>
            <label>Text align<select data-text-align><option value=left>left</option><option value=center>center</option><option value=right>right</option></select></label>
          </div>
          <label class="full-field">Note<input data-box-note></label>
          <div class="coordinate-grid" aria-label="文字框座標">
            <label>x (%)<input type="number" min="0" max="100" step="0.01" data-coordinate-input="x"></label>
            <label>y (%)<input type="number" min="0" max="100" step="0.01" data-coordinate-input="y"></label>
            <label>width (%)<input type="number" min="4" max="100" step="0.01" data-coordinate-input="width"></label>
            <label>height (%)<input type="number" min="3" max="100" step="0.01" data-coordinate-input="height"></label>
          </div>
          <p class="status-line" data-reading-order-status></p>
        </section>

        <section class="panel-section">
          <h2>閱讀預覽</h2>
          <div class="preview-sizes" role="group" aria-label="預覽寬度">
            <button type="button" class="is-active" data-preview-width="fit">Fit width</button>
            <button type="button" data-preview-width="390">390</button>
            <button type="button" data-preview-width="430">430</button>
            <button type="button" data-preview-width="768">768</button>
          </div>
          <div class="toggle-row"><label><input type="checkbox" data-art-toggle checked> Clean art</label><label><input type="checkbox" data-text-toggle checked> Text on</label></div>
          <p class="status-line" data-overflow-status></p>
        </section>

        <section class="panel-section">
          <h2>儲存與檢查</h2>
          <div class="action-grid">
            <button type="button" data-save>暫存</button>
            <button type="button" data-export>匯出 JSON</button>
            <label class="file-action">匯入 JSON<input type="file" accept="application/json,.json" data-import></label>
            <button type="button" data-reset>重設本頁資料</button>
          </div>
          <label class="full-field utf-field">UTF-8 測試字串<input value="測試中文：上一場衝突，還在震。！？「」" data-utf-input></label>
          <button type="button" data-utf-test>執行 UTF-8 round-trip</button>
          <p class="status-line" data-utf-status></p>
          <p class="status-line" aria-live="polite" data-app-status></p>
        </section>
      </aside>

      <section class="canvas-panel" aria-label="漫畫文字圖層畫布">
        <div class="preview-frame" data-preview-frame>
          <div class="manga-stage" data-stage>
            <img src="/crasher-nwf-web-story/images/manga_new/editor/c_nwf_ch02_ep21_001_p01_v02.png" width="1024" height="1536" alt="EP21 001 p01 clean art" data-art>
            <div class="text-layer" data-text-layer></div>
          </div>
        </div>
      </section>
    </section>
    <div class="utf-probe" aria-hidden="true" data-utf-preview></div>
  </main>
  <script src="/crasher-nwf-web-story/js/tools-new-manga-editor-config.js"></script>
  <script src="/crasher-nwf-web-story/js/tools-new-manga-text-editor.js" defer></script>
</body>
</html>
